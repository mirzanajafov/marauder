name: marauder

services:
  timescaledb:
    image: timescale/timescaledb:2.30.1-pg16
    container_name: marauder-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: marauder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: marauder
    volumes:
      - marauder_timescale:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marauder -d marauder']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: marauder-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    networks:
      - internal

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: marauder-mosquitto
    restart: unless-stopped
    volumes:
      - ../infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - internal

  api:
    image: marauder-api
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    container_name: marauder-api
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      MQTT_URL: mqtt://mosquitto:1883
      API_PORT: 3001
      API_PREFIX: api
      TRUST_PROXY_HOPS: 2
    healthcheck:
      test: ['CMD', 'wget', '-q', '-T', '4', '-O', '/dev/null', 'http://127.0.0.1:3001/api/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
      mosquitto:
        condition: service_started
    networks:
      - internal

  web:
    image: marauder-web
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    container_name: marauder-web
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-T', '4', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    depends_on:
      - api
    networks:
      - internal
      - edge

  simulator:
    image: marauder-simulator
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: simulator
    container_name: marauder-simulator
    restart: unless-stopped
    init: true
    environment:
      MQTT_URL: mqtt://mosquitto:1883
    depends_on:
      - mosquitto
      - api
    networks:
      - internal

  backup:
    image: timescale/timescaledb:2.30.1-pg16
    container_name: marauder-backup
    restart: unless-stopped
    entrypoint: ['sh', '/usr/local/bin/backup.sh']
    environment:
      PGHOST: timescaledb
      PGUSER: marauder
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: marauder
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/usr/local/bin/backup.sh:ro
      - marauder_backups:/backups
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    name: marauder_internal
  edge:
    name: edge
    external: true

volumes:
  marauder_timescale:
  marauder_backups:
