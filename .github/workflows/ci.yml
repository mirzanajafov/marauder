name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/*" build
      - run: pnpm --filter @marauder/api exec prisma generate
      - run: pnpm test
      - run: pnpm build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter "./packages/*" build
      - run: pnpm --filter @marauder/api exec prisma generate
      - run: pnpm typecheck
      - run: pnpm lint

  scanner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hardware/ble-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile --target api -t marauder-api .
      - run: docker build -f deploy/Dockerfile --target simulator -t marauder-simulator .
      - run: docker build -f deploy/Dockerfile --target web -t marauder-web .
      - run: docker run --rm marauder-api ./node_modules/.bin/prisma --version
      - run: >-
          docker run --rm
          -e DATABASE_URL=postgresql://marauder:marauder@db:5432/marauder
          -e REDIS_URL=redis://redis:6379
          -e MQTT_URL=mqtt://mosquitto:1883
          -e WEB_ORIGIN=https://example.test
          -e ADMIN_PASSWORD=ci-only-admin-password
          -e JWT_SECRET=ci-only-secret-long-enough-for-hs256
          marauder-api node dist/check-config.js
      - run: docker run --rm -e MQTT_URL=mqtt://mosquitto:1883 marauder-simulator node dist/check-config.js

  e2e:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      timescaledb:
        image: timescale/timescaledb:2.30.1-pg16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: marauder
          POSTGRES_PASSWORD: marauder
          POSTGRES_DB: marauder
        options: >-
          --health-cmd "pg_isready -U marauder -d marauder"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://marauder:marauder@localhost:5432/marauder?schema=public
      REDIS_URL: redis://localhost:6379
      MQTT_URL: mqtt://localhost:1883
      WEB_ORIGIN: http://localhost:5173
      ADMIN_PASSWORD: ci-only-admin-password
      JWT_SECRET: ci-only-secret-long-enough-for-hs256
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/*" build
      - run: pnpm --filter @marauder/api exec prisma generate
      - run: pnpm --filter @marauder/api exec prisma migrate deploy
      - run: docker run -d -p 1883:1883 -v "$PWD/infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto:2
      - run: pnpm --filter @marauder/api test:e2e
      - run: pnpm --filter @marauder/api prisma:seed
